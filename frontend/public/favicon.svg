<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="natask-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="natask-grad-diag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#natask-grad-bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
  
  <!-- Geometric NaTask 'N' + Task Concept -->
  <g filter="url(#glow)">
    <!-- Left Pillar -->
    <rect x="14" y="14" width="8" height="36" rx="4" fill="#FFFFFF"/>
    
    <!-- Diagonal Connecting Stroke -->
    <path d="M18 18 L46 46" stroke="url(#natask-grad-diag)" stroke-width="8.5" stroke-linecap="round"/>
    
    <!-- Right Pillar -->
    <rect x="42" y="14" width="8" height="36" rx="4" fill="#FFFFFF"/>
    
    <!-- Accent Spark/Task Point -->
    <circle cx="46" cy="18" r="3.5" fill="#38BDF8"/>
  </g>
</svg>